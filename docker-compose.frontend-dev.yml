# Opt-in live editing only: release mode bakes static into the image so Python and assets ship from one build.
# Pair with `make livemap-watch`, and bring livemap up with all three files:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.frontend-dev.yml up -d livemap
services:
  livemap:
    volumes:
      - ./livemap/static:/app/static:ro
