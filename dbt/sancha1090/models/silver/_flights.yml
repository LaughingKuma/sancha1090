version: 2

models:
  - name: dim_aircraft_registry
    description: "Aircraft identity registry: OpenSky weekly CSV snapshots, blanks per-column filled from ADSBExchange basic-ac-db when bronze.adsbx_aircraft_db exists (deploy-order guarded); latest as_of_date per airframe; country via ICAO24 block ranges"
    columns:
      - name: icao24
        description: "Lowercase ICAO 24-bit hex; one row per airframe"
        tests:
          - not_null
          - unique
  - name: stg_flight_segments_adsblol
    description: Global flight segments extracted from adsb.lol full traces (route backstory lane).
    columns:
      - name: icao24
        tests: [not_null]
      - name: seg_start_time
        tests: [not_null]
  - name: int_flight_routes_adsblol
    description: Airport-snapped segment endpoints; NULL endpoint = cruise or no airport within snap range.
    columns:
      - name: icao24
        tests: [not_null]
  - name: int_flight_chains_adsblol
    description: Coverage-gap segments chained into whole flights (cruise-plausible implied boundary speed); origin = first segment's snap, dest = last segment's.
    columns:
      - name: icao24
        tests: [not_null]
      - name: chain_start
        tests: [not_null]
  - name: int_flight_legs_opensky
    description: OpenSky-states O/D opinion (sessionize + pure sched-gated snap + callsign-split); a reconciler input. fct_flight_legs consumes this model (SP2 dedup); canonical OpenSky-states O/D opinion.
    columns:
      - name: icao24
        tests: [not_null]
      - name: start_time
        tests: [not_null]
      - name: end_time
        tests: [not_null]
  - name: int_flight_opinions
    description: Windowed O/D opinions from all sources in one common schema (source_rank 1=swim, 3=opensky_flights, 4=adsblol, 5=opensky_states; 2 is vrs_routes, attached downstream in int_flight_attach); reconciler input. Rank only breaks a tie — plurality decides first.
    columns:
      - name: icao24
        tests: [not_null]
      - name: source
        tests:
          - accepted_values:
              arguments:
                values: ['swim', 'opensky_flights', 'adsblol', 'opensky_states']
  - name: int_flight_spine
    description: One row per authority-ranked flight anchor; flight_id is the reconciliation key. Near-duplicate opensky_flights summaries for the same physical flight are merged here, and implausibly long single-source anchors are capped.
    columns:
      - name: flight_id
        tests: [not_null, unique]
  - name: int_flight_attach
    description: Materialized attached opinion votes plus downstream windowless VRS reconciliation.
    tests:
      - grain:
          arguments:
            column_names: [flight_id, source]
    columns:
      - name: flight_id
        tests: [not_null]
  - name: int_flight_attached_votes
    description: Windowed source opinions reduced to one deterministic best-overlap vote per flight and source.
    columns:
      - name: flight_id
        tests: [not_null]
