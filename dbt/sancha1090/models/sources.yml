version: 2

sources:
  - name: bronze
    description: "Bronze landing: the ClickHouse `bronze` database, loaded from the Garage S3 Parquet zone. dbt-clickhouse renders schema as the database and drops the catalog component."
    database: bronze
    schema: bronze
    tables:
      - name: opensky_states
        description: "Aircraft state vectors loaded from the Garage Parquet landing zone. Three timestamps, never interchangeable: snapshot_time is when OpenSky observed the state (the only one to filter or group on), ingested_at the scheduled tick the fetch ran for, committed_at when the loader inserted the row (excluded from the dedup fingerprint so a replay collapses). spi is Nullable(Bool) here, Nullable(Int64) in adsb_states."
        columns:
          - name: icao24
            tests:
              - not_null
          - name: snapshot_time
            description: "Observation time (UTC). snapshot_date is MATERIALIZED from it and drives the partition."
            tests:
              - not_null
      - name: adsb_states
        description: "Byte-faithful readsb ADS-B state vectors; db_flags is the dbFlags integer baked at load (the verbatim _raw_json blob is not in CH — it lives in the source Garage/NAS Parquet). Column names and types mirror readsb, so: `desc` is a ClickHouse reserved word and must be backticked in every query; alt_baro is a String because readsb emits the literal 'ground' alongside numeric altitudes; spi is Int64 here, Bool in opensky_states. capture_ts is a Float64 epoch second, and capture_date is MATERIALIZED from it for the partition key."
        columns:
          - name: hex
            description: "Lowercase Mode-S address; joins to the OpenSky feed as hex = lower(icao24)."
            tests:
              - not_null
      - name: opensky_flights
        description: "Flight summaries (arrivals/departures) for the tracked JP airports; a flight can surface in multiple capture windows — dedupe downstream"
        tags: ['flights']
        columns:
          - name: icao24
            tests:
              - not_null
          - name: first_seen
            tests:
              # bronze is raw/byte-faithful to the source Parquet — a few historical-backfill rows carry a null
              # first_seen; fact_flights filters them (where first_seen is not null), so warn, don't fail the raw layer.
              - not_null:
                  config:
                    severity: warn
      - name: aircraft_db
        description: "Weekly snapshots of OpenSky's aircraft registry CSV (identity/operator layer); latest as_of_date wins downstream"
        tags: ['flights']
        columns:
          - name: icao24
            tests:
              - not_null
      - name: adsbx_aircraft_db
        description: "ADSBExchange basic-ac-db weekly snapshots (registry type/identity fill). Intentionally optional pre-deploy: no source tests (they query the relation directly); dim_aircraft_registry's deploy-order guard skips the fill when the table is absent. ownop is the FAA registrant, never the operator."
      - name: adsblol_states
        description: "Backfilled pre-pipeline state snapshots (adsb.lol globe_history, ODbL); Japan-wide box, 12-min snapshot tier, provenance in `source`"
        tags: ['adsblol']
        columns:
          - name: icao24
            tests:
              - not_null
          - name: snapshot_time
            tests:
              - not_null
      - name: adsblol_flight_segments
        description: "Global flight segments from adsb.lol full traces (ODbL); overflight route backstory, RMT versioned on ingested_at"
        tags: ['adsblol']
        columns:
          - name: icao24
            tests:
              - not_null
          - name: seg_start
            tests:
              - not_null
      - name: adsblol_flight_paths
        description: "Full path points of the kept segments (ODbL); consumed by fct_flight_path as the adsb.lol trajectory source. max(trace_day)-path_settlement_lag_days gates the next eligible path start day. RMT versioned on ingested_at"
        tags: ['adsblol']
        columns:
          - name: icao24
            tests:
              - not_null
          - name: ts
            tests:
              - not_null
      - name: swim_flightdata
        description: "FAA SWIM TFMData filed flight plans; one row per fltdMessage, parsed by include/swim_parser.py."
        columns:
          - name: msg_timestamp
            description: "@sourceTimeStamp — the amendment version; on every message, used for argMax + ORDER BY."
            tests:
              - not_null
          - name: dep_point_kind
            description: "How the filed departure point was expressed: 'airport' (dep_point holds the ICAO code), 'latlon', 'fixradial', 'fix', or 'unknown'. Only 'airport' yields a usable endpoint; the others leave dep_point NULL with the filed text in dep_point_raw. arr_point_kind is the same domain for the arrival end."
          - name: computer_id
            description: "FAA computer ID as 'facility/number' (e.g. ZOB/123). Either half can be missing: the parser joins only the parts present, so a partial pair is 'ZOB' or '123', never 'ZOB/None'. NULL when neither is filed."
          - name: gufi
            description: "Globally unique flight identifier when the message carries one; first choice for the flight identity key."
          - name: acid
            description: "Filed aircraft ID (the callsign). Messages without one are dropped from silver_ch.swim_latest: the filed plan is only matched to an airframe through this callsign, so a row without acid can never attach to a flight."
      - name: path_estimates
        description: "Livemap estimate-serving exhaust: one request row (seg_idx=0) plus one row per served segment, INSERT-only via livemap_writer. Analytics substrate only — estimate rows never enter the flight marts (standing invariant)."
        columns:
          - name: estimate_id
            tests:
              - not_null
          - name: producer
            tests:
              - not_null

  - name: silver_ch
    description: "MV-owned silver objects created outside dbt by include/ch_incremental_mvs.py (P4 AggregatingMergeTree accumulators + their merge-aware serving views)."
    database: silver_ch
    schema: silver_ch
    tables:
      - name: swim_latest
        description: "Merge-aware serving view over silver_ch.swim_latest_acc (#201): latest SWIM amendment per flight_key as argMaxMerge(latest_state) over (msg_timestamp, _dedup_fp); latest_tuple.1..7 is a positional contract owned by the spec in include/ch_incremental_mvs.py. No source tests: they query the relation directly, but the view is operator-created at deploy (init DAG) — a source test would break the deploy-order guard."

  - name: dim
    description: "Operator-loaded dimensions created by clickhouse-init (not dbt-managed): reference lists the marts read."
    database: dim
    schema: dim
    tables:
      - name: dim_ladd
        description: "FAA LADD privacy-list SCD2 intervals (SP3b); ReplacingMergeTree(_version) — read with FINAL. An open interval (valid_to NULL) is a currently-listed airframe; a closed interval protects data produced while it was listed. No source tests: they query the relation directly, but dim.dim_ladd is intentionally optional pre-deploy (the mart's deploy-order guard skips it when absent). Row validity/grain is enforced at the single writer (include/ladd.py: SCD2 plan keyed on registration, zero-valid-reg raise, mass-close guard)."
        columns:
          - name: registration
            description: "US N-number (normalized upper, N-prefixed) — the SCD2 identity key."
          - name: callsign
            description: "Normalized callsign (trim+upper) when the list carried one, else NULL; a second suppression-match key."
          - name: icao24
            description: "Resolved lowercase ICAO 24-bit hex (FAA registry first, N-number algorithm fallback); nullable by design — an unresolved N-number still suppresses by callsign."
          - name: valid_from
            description: "List date the interval opened (SCD2 valid-from); part of the RMT dedup key with registration."
          - name: valid_to
            description: "List date the interval closed, or NULL while the airframe is currently listed (open interval)."
      - name: dim_vrs_routes
        description: "vradarserver standing-data callsign→route table (SP4), daily pull via ingest_vrs_routes; ReplacingMergeTree(ingested_at) keyed callsign — read with FINAL. No source tests: optional pre-deploy (stg_vrs_routes's deploy-order guard emits empty until clickhouse-init creates it). AirportCodes is a '-'-joined ICAO hop list; parsing/validation lives in stg_vrs_routes."
        columns:
          - name: callsign
            description: "Route key as published (may be zero-padded vs transmitted callsigns; normalize with callsign_norm at match time)."
          - name: airport_codes
            description: "ICAO hop list, e.g. RJTT-RJFF or RJAA-RCTP-VHHH; staging explodes every adjacent pair into a candidate schedule leg."
